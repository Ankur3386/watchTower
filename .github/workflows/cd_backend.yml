name: deploy
on:
  push:
    branches:
      - master
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
     - name: checkout
       uses: actions/checkout@v4
     - name: login-to-dockerhub
       uses: docker/login-action@v4
       with:
         username: ${{secrets.DOCKERHUB_USERNAME}}
         password: ${{secrets.DOCKERHUB_TOKEN}}
     - name: build-and-push
       uses: docker/build-push-action@v5
       with:
         context: .
         file: docker/Dockerfile.http
         push: true
         tags: ${{secrets.DOCKERHUB_USERNAME}}/http:${{github.sha}}
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push  
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name:  deploy-on-aws
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{secrets.VM_IP}}
        username: ubuntu
        key: ${{secrets.KEY}}
        script: |
          docker pull ${{secrets.DOCKERHUB_USERNAME}}/http:${{github.sha}}
          docker network create watchTower-network || true
          docker stop http || true
          docker rm http || true
          docker run \
           --network watchTower-network \
           --name http \
           -p 3000:3000 \
           -e DATABASE_URL_TIMESCALE=${{secrets.DATABASE_URL_TIMESCALE}} \
           -e DATABASE_URL=${{secrets.DATABASE_URL}} \
           -e API_SECRET=${{secrets.API_SECRET}} \
           -e JWT_SECRET=${{secrets.JWT_SECRET}} \
           ${{secrets.DOCKERHUB_USERNAME}}/http:${{github.sha}}
          