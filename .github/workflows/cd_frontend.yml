name: deploy
on:
  push:
    branches:
     - master
jobs:
  build-and-push:
    runs-on: ubuntu
    steps:
     - name: checkout
       uses: actions/checkout@v4 
     - name: docker-login
       uses: docker/login-action@v4
       with: 
         username: ${{secrets.DOCKERHUB_USERNAME}}
         password: ${{secrets.DOCKERHUB_TOKEN}}
     - name: build-and-push
       uses: docker/build-push-action@v5
       with:
         context: .
         files: docker/Dockerfile.fe 
         push: true
         tags: ${{secrets.DOCKERHUB_USERNAME}}/fe:${{github.sha}}  
  deploy-on-Vm:
    runs-on: ubuntu
    needs: build-and-push
    steps:
     - name: checkout
       uses: actions/checkout@v4
     - name: deploy-on-aws
       uses: appleboy/ssh-action@v1.0.3
       with:
         host: ${{secrets.VM_IP}}
         username: ubuntu
         key: ${{secrets.key}}
         script: |
           docker pull ${{secrets.DOCKERHUB_USERNAME}}/fe:${{github.sha}} 
           docker stop fe || true
           docker rm fe || true
           docker run --name fe -p 5173:5173 ${{secrets.DOCKERHUB_USERNAME}}/fe:${{github.sha}}

         

         